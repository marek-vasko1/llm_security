version: "3.9"

services:
  service1:
    build: ./service1
    container_name: kali
    stdin_open: true
    tty: true
    networks:
      - demo-net
    volumes:
      - ./service1:/app:Z

  api-wrapper:
    build: ./service2   
    container_name: api-wrapper
    networks:
      - demo-net
    environment:
      API_KEY: ${API_KEY}
      BASE_URL: ${BASE_URL}
    volumes:
      - ./service2/main.py:/app/main.py:Z     
      - ./service2/mcp_server.py:/app/mcp_server.py:Z

networks:
  demo-net:
    driver: bridge
