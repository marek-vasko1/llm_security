version: "3.9"

services:
  service1:
    image: pair-implemented
    container_name: kali
    stdin_open: true
    tty: true
    networks:
      - demo-net

  api-wrapper:
    build: ./service2
    container_name: api-wrapper
    networks:
      - demo-net
    environment:
      API_KEY: ${API_KEY}
      BASE_URL: ${BASE_URL}
    volumes:
      - ./service2:/app:Z 
networks:
  demo-net:
    external: true
